name: Rendiconto GAIA

on:
  schedule:
    - cron: "23 */3 * * *"   # ogni 3 ore
  workflow_dispatch:          # pulsante "Run workflow" per avviarlo a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  crea:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa programmi
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Recupera lo stato delle notifiche
        uses: actions/cache/restore@v4
        with:
          path: stato
          key: stato-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: stato-
      - name: Leggi GAIA, crea la pagina e invia le notifiche
        env:
          GAIA_EMAIL: ${{ secrets.GAIA_EMAIL }}
          GAIA_PASSWORD: ${{ secrets.GAIA_PASSWORD }}
          PASSWORD_PAGINA: ${{ secrets.PASSWORD_PAGINA }}
          PUSH_ISCRIZIONI: ${{ secrets.PUSH_ISCRIZIONI }}
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_PASSWORD_APP: ${{ secrets.ICLOUD_PASSWORD_APP }}
          NOTIFICA_DISPONIBILI: "no"   # metti "si" per un avviso sui nuovi turni senza volontari
        run: python rendiconto.py
      - name: Salva lo stato delle notifiche
        uses: actions/cache/save@v4
        with:
          path: stato
          key: stato-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito

  pubblica:
    needs: crea
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
